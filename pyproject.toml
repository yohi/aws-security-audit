[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "aws-security-audit"
version = "0.1.0"
description = "Read-only AWS security checklist audit CLI (46 controls)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "boto3[crt]==1.43.18",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.11"]

[project.scripts]
aws-security-audit = "aws_security_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_security_audit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
