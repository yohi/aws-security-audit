name: Python audit CLI checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify committed lock and immutable digest (STS2-004)
        run: |
          sha256sum --check docs/uv-lock.sha256
          uv lock --check
          sha256sum --check docs/uv-lock.sha256
      - name: Install dependencies from committed lock
        run: uv sync --locked --extra dev
      - name: Record verified dependency lock digest
        run: sha256sum uv.lock > uv-lock.sha256
      - name: Upload resolved dependency lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-${{ matrix.python-version }}
          path: |
            uv.lock
            uv-lock.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Offline unit tests (no AWS credentials)
        run: uv run --locked pytest -q
      - name: Build CLI package
        run: uv build
